name: Build and Test Cyd

on:
  workflow_dispatch:
    inputs:
      sign_windows_release:
        description: Submit the Windows installer to SignPath and publish the signed dev-latest release
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cyd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      ELECTRON_CACHE: /tmp/.cache/electron
      ELECTRON_BUILDER_CACHE: /tmp/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Match upstream npm version
        run: npm install -g npm@12.0.2

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Rebuild better-sqlite3 for Electron
        run: |
          ELECTRON_VERSION=$(node -e "console.log(require('./node_modules/electron/package.json').version)")
          echo "Rebuilding better-sqlite3 for Electron $ELECTRON_VERSION"
          npm_config_runtime=electron npm_config_target=$ELECTRON_VERSION npm_config_disturl=https://electronjs.org/headers npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: Run lint
        run: npm run lint

      - name: Verify failing tests cannot pass CI
        run: xvfb-run -a node scripts/verify-test-exit-code.mjs

      - name: Run tests
        run: xvfb-run -a npm run test:ci
        env:
          CI: true

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_CACHE: /tmp/.cache/electron
      ELECTRON_BUILDER_CACHE: /tmp/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Match upstream npm version
        run: npm install -g npm@12.0.2

      - name: Install Linux test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron
        if: matrix.os == 'ubuntu-latest'
        run: |
          ELECTRON_VERSION=$(node -e "console.log(require('./node_modules/electron/package.json').version)")
          echo "Rebuilding better-sqlite3 for Electron $ELECTRON_VERSION"
          npm_config_runtime=electron npm_config_target=$ELECTRON_VERSION npm_config_disturl=https://electronjs.org/headers npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: Run lint
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: npm run lint

      - name: Verify failing tests cannot pass CI
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: xvfb-run -a node scripts/verify-test-exit-code.mjs

      - name: Run tests
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: xvfb-run -a npm run test:ci
        env:
          CI: true

      - name: Build app
        run: npm run make-dev

      - name: Set and verify Windows product metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $PWD "out/make/squirrel.windows") -Recurse -File |
            Where-Object { $_.Name -match "Setup\.exe$" })
          if ($installers.Count -ne 1) { throw "Expected one Windows installer." }
          & (Join-Path $PWD "node_modules/electron-winstaller/vendor/rcedit.exe") $installers[0].FullName `
            --set-version-string ProductName Cyd --set-version-string FileDescription Cyd `
            --set-product-version $version --set-file-version $version
          if ($LASTEXITCODE -ne 0) { throw "Installer metadata update failed." }
          ./scripts/verify-windows-metadata.ps1 -Path $installers[0].FullName -ExpectedVersion $version
          $apps = @(Get-ChildItem -Path "out/*-win32-*/Cyd*.exe" -File)
          if ($apps.Count -ne 1) { throw "Expected one packaged application executable." }
          ./scripts/verify-windows-metadata.ps1 -Path $apps[0].FullName -ExpectedVersion $version

      - name: Verify packaged fork features
        run: node scripts/verify-fork-build.mjs

      - name: Verify local native crash capture
        if: matrix.os == 'windows-latest'
        run: node scripts/verify-local-crash-dumps.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-${{ matrix.os }}
          path: out/**
          if-no-files-found: error

      - name: Prepare standalone Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $PWD "out\make\squirrel.windows") -Recurse -File |
            Where-Object { $_.Name -match "Setup\.exe$" })
          if ($installers.Count -ne 1) { throw "Expected exactly one Squirrel Setup.exe installer." }
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $env:RUNNER_TEMP "CydDevSetup.exe") -Force

      - name: Upload standalone Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}/CydDevSetup.exe
          if-no-files-found: error

  publish-windows:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 330
    permissions:
      actions: read
      contents: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer

      - name: Prepare standalone Windows installer
        id: prepare-installer
        shell: pwsh
        run: |
          $setupRoot = Join-Path $PWD "installer"

          $installer = Get-ChildItem -Path $setupRoot -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -match "Setup\.exe$" } |
            Sort-Object @{ Expression = { if ($_.Name -eq "CydDevSetup.exe") { 0 } else { 1 } } }, FullName |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "Downloaded installer files:"
            Get-ChildItem -Path $setupRoot -Recurse -File |
              ForEach-Object { Write-Host $_.FullName }
            throw "No Squirrel Setup.exe installer was found."
          }

          $publishPath = Join-Path $env:RUNNER_TEMP "CydDevSetup.exe"
          Copy-Item -Path $installer.FullName -Destination $publishPath -Force
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-metadata.ps1 -Path $publishPath -ExpectedVersion $version
          "publish-path=$publishPath" >> $env:GITHUB_OUTPUT

      - name: Select Windows publication mode
        id: publication-mode
        shell: pwsh
        env:
          SIGN_WINDOWS_RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_windows_release }}
        run: |
          $required = @(
            $env:SIGNPATH_API_TOKEN,
            $env:SIGNPATH_ORGANIZATION_ID,
            $env:SIGNPATH_PROJECT_SLUG,
            $env:SIGNPATH_SIGNING_POLICY_SLUG,
            $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          )
          $configured = -not ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          $requested = $env:SIGN_WINDOWS_RELEASE_REQUESTED -eq "true"

          if ($requested -and $env:GITHUB_REF -ne "refs/heads/main") {
            throw "SignPath release signing is only allowed from the main branch."
          }

          if ($requested -and -not $configured) {
            throw "Signed release requested, but one or more SignPath repository settings are missing. See docs/code-signing.md."
          }

          if ($requested) {
            $mode = "signed"
          }
          elseif ($configured) {
            # Once SignPath is configured, do not let an ordinary push replace a
            # previously signed rolling release with an unsigned executable.
            $mode = "skip"
          }
          else {
            # Transitional behavior before SignPath onboarding is complete.
            $mode = "unsigned"
          }

          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "Windows publication mode: $mode"

      - name: Explain skipped unsigned publication
        if: steps.publication-mode.outputs.mode == 'skip'
        shell: pwsh
        run: |
          Write-Host "SignPath is configured, so this ordinary build will not overwrite dev-latest with an unsigned Windows installer."
          Write-Host "Run this workflow manually on main with sign_windows_release enabled to publish a signed installer."

      - name: Prepare SignPath input
        if: steps.publication-mode.outputs.mode == 'signed'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "signpath-input"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item -LiteralPath "${{ steps.prepare-installer.outputs.publish-path }}" -Destination (Join-Path $dir "CydDevSetup-signpath-input.exe") -Force

      - name: Upload unsigned installer for SignPath origin verification
        if: steps.publication-mode.outputs.mode == 'signed'
        id: upload-signpath-input
        uses: actions/upload-artifact@v4
        with:
          name: signpath-windows-input-${{ github.run_id }}
          path: ${{ runner.temp }}/signpath-input/CydDevSetup-signpath-input.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: steps.publication-mode.outputs.mode == 'signed'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-signpath-input.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Verify and select signed installer
        if: steps.publication-mode.outputs.mode == 'signed'
        shell: pwsh
        run: |
          $signedRoot = Join-Path $env:RUNNER_TEMP "signpath-signed"
          $signed = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter "*.exe")
          if ($signed.Count -ne 1) {
            Write-Host "Signed artifact files:"
            Get-ChildItem -LiteralPath $signedRoot -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one signed executable from SignPath."
          }

          $publishPath = "${{ steps.prepare-installer.outputs.publish-path }}"
          Copy-Item -LiteralPath $signed[0].FullName -Destination $publishPath -Force

          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-metadata.ps1 -Path $publishPath -ExpectedVersion $version
          $signature = Get-AuthenticodeSignature -LiteralPath $publishPath
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          }
          if ($signature.Status -ne "Valid") {
            throw "SignPath returned an executable that Windows does not consider to have a valid Authenticode signature."
          }

      - name: Publish standalone Windows installer
        if: steps.publication-mode.outputs.mode != 'skip'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_MODE: ${{ steps.publication-mode.outputs.mode }}
        run: |
          $publishPath = "${{ steps.prepare-installer.outputs.publish-path }}"
          if (-not (Test-Path -LiteralPath $publishPath)) {
            throw "Installer to publish does not exist: $publishPath"
          }

          Write-Host "Publishing installer: $publishPath"
          $digest = (Get-FileHash -LiteralPath $publishPath -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($env:PUBLICATION_MODE -eq "signed") {
            $signature = Get-AuthenticodeSignature -LiteralPath $publishPath
            if ($signature.Status -ne "Valid") { throw "Refusing to publish an invalid signed installer." }
            $notes = "Windows build from commit ${{ github.sha }}. Authenticode signed via SignPath Foundation. SHA256: $digest"
          }
          else {
            $notes = "Windows build from commit ${{ github.sha }}. UNSIGNED development build. SHA256: $digest"
          }

          $notes += "`n`nCyd is an independently maintained GPL-3.0-only fork of lockdown-systems/cyd. Back up, selectively delete, and migrate social media data. No usage analytics or remote error reports are sent by this fork."
          $notes += "`n`nPrivacy and platform connections: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/privacy.md"
          $notes += "`nSource and license: https://github.com/${{ github.repository }}/tree/${{ github.sha }}"
          $notes += "`nInstall by running CydDevSetup.exe. Uninstall Cyd Dev through Windows Settings > Apps. Local archives and settings are retained; see the privacy notice for data removal."
          $notes += "`n`nCode signing policy: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/code-signing.md"

          $notes += "`nFree code signing provided by https://signpath.io/, certificate by https://signpath.org/ (onboarding pending for unsigned builds)."

          if (gh release view dev-latest --repo "${{ github.repository }}" 2>$null) {
            gh release upload dev-latest $publishPath --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Installer upload failed." }

            gh release edit dev-latest --notes $notes --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Release metadata update failed." }

            gh api --method PATCH `
              "repos/${{ github.repository }}/git/refs/tags/dev-latest" `
              -f sha="${{ github.sha }}" `
              -F force=true
            if ($LASTEXITCODE -ne 0) { throw "Release tag update failed." }
          }
          else {
            gh release create dev-latest $publishPath `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Cyd Dev Latest" `
              --notes $notes `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          }
