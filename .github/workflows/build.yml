name: Build Cyd

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run make-dev

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-${{ matrix.os }}
          path: out/**
          if-no-files-found: warn

      - name: Publish standalone Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "out/make/squirrel.windows/x64/CydDevSetup.exe"

          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          if (gh release view dev-latest --repo "${{ github.repository }}" 2>$null) {
            gh release upload dev-latest $installer --clobber --repo "${{ github.repository }}"
          }
          else {
            gh release create dev-latest $installer `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Cyd Dev Latest" `
              --notes "Automatically updated with the latest development Windows build." `
              --prerelease
          }
