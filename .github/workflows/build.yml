name: Build and Test Cyd

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cyd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      ELECTRON_CACHE: /tmp/.cache/electron
      ELECTRON_BUILDER_CACHE: /tmp/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Match upstream npm version
        run: npm install -g npm@12.0.2

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Rebuild better-sqlite3 for Electron
        run: |
          ELECTRON_VERSION=$(node -e "console.log(require('./node_modules/electron/package.json').version)")
          echo "Rebuilding better-sqlite3 for Electron $ELECTRON_VERSION"
          npm_config_runtime=electron npm_config_target=$ELECTRON_VERSION npm_config_disturl=https://electronjs.org/headers npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: xvfb-run -a npm run test:ci
        env:
          CI: true

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_CACHE: /tmp/.cache/electron
      ELECTRON_BUILDER_CACHE: /tmp/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Match upstream npm version
        run: npm install -g npm@12.0.2

      - name: Install Linux test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron
        if: matrix.os == 'ubuntu-latest'
        run: |
          ELECTRON_VERSION=$(node -e "console.log(require('./node_modules/electron/package.json').version)")
          echo "Rebuilding better-sqlite3 for Electron $ELECTRON_VERSION"
          npm_config_runtime=electron npm_config_target=$ELECTRON_VERSION npm_config_disturl=https://electronjs.org/headers npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: Run lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:ci
        env:
          CI: true

      - name: Build app
        run: npm run make-dev

      - name: Verify packaged fork features
        run: node scripts/verify-fork-build.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-${{ matrix.os }}
          path: out/**
          if-no-files-found: error

      - name: Prepare standalone Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $PWD "out\make\squirrel.windows") -Recurse -File |
            Where-Object { $_.Name -match "Setup\.exe$" })
          if ($installers.Count -ne 1) { throw "Expected exactly one Squirrel Setup.exe installer." }
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $env:RUNNER_TEMP "CydDevSetup.exe") -Force

      - name: Upload standalone Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}/CydDevSetup.exe
          if-no-files-found: error

  publish-windows:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer

      - name: Publish standalone Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setupRoot = Join-Path $PWD "installer"

          $installer = Get-ChildItem -Path $setupRoot -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -match "Setup\.exe$" } |
            Sort-Object @{ Expression = { if ($_.Name -eq "CydDevSetup.exe") { 0 } else { 1 } } }, FullName |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "Downloaded installer files:"
            Get-ChildItem -Path $setupRoot -Recurse -File |
              ForEach-Object { Write-Host $_.FullName }
            throw "No Squirrel Setup.exe installer was found."
          }

          $publishPath = Join-Path $env:RUNNER_TEMP "CydDevSetup.exe"
          Copy-Item -Path $installer.FullName -Destination $publishPath -Force
          Write-Host "Publishing installer: $($installer.FullName)"
          $digest = (Get-FileHash -LiteralPath $publishPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "Windows build from commit ${{ github.sha }}. SHA256: $digest"

          if (gh release view dev-latest --repo "${{ github.repository }}" 2>$null) {
            gh release upload dev-latest $publishPath --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Installer upload failed." }

            gh release edit dev-latest --notes $notes --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Release metadata update failed." }

            gh api --method PATCH `
              "repos/${{ github.repository }}/git/refs/tags/dev-latest" `
              -f sha="${{ github.sha }}" `
              -F force=true
            if ($LASTEXITCODE -ne 0) { throw "Release tag update failed." }
          }
          else {
            gh release create dev-latest $publishPath `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Cyd Dev Latest" `
              --notes $notes `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          }
